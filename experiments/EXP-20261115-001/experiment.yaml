id: EXP-20261115-001
title: Meta Quest Pro controller input to Linux dual-UR5e MuJoCo via XRoboToolkit
project: unitree-g1
owner: David Wei
participants: []
status: proposed
prepared_date: 2026-11-15
timezone: America/Los_Angeles
