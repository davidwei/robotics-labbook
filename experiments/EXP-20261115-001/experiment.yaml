  discovery_udp_destination_port: 29888
  sdk_grpc_default: "127.0.0.1:60061"
  manual_connection: Bare reachable Linux LAN IPv4 address
controls:
  arm_enable: Same-side side grip greater than 0.9
  initial_a_toggle: disabled
  initial_hand_tracking: disabled
  initial_remote_vision: disabled
  normal_stop: Release grips while Send is on, stop simulation with Ctrl+C, verify exit, then Send off
  reconnect: Simulator stopped first; verify fresh released-grip input before restarting
planned_activities:
  - P0-P4 environment, installation, graphics, APK, service/network preflight
  - R1 input-only diagnostic run with SDK snapshot capture
  - P5 audible operator workflow rehearsal
  - R2 bounded right/left/bimanual MuJoCo run
  - R3 clean-restart repetition
  - D1 optional reconnect diagnostic with simulator stopped
  - C0-C1 cleanup, evidence verification, and closeout
prerequisites:
  - Confirm actual Ubuntu release, x86_64 architecture, Python, desktop graphics, and free storage.
  - Enable Quest developer mode and authorize the intended Linux computer through ADB.
  - Confirm headset/controller identity, charge, reachable LAN, and operator/observer roles.
  - Download exact release artifacts and verify checksums.
  - Pass dependency imports, CLI help, model load, and local viewer before headset control.
  - Confirm fresh changing input and released grips; connection status alone is insufficient.
evidence_to_capture:
  - Host/headset/controller identity and software/build versions
  - Source revisions, dirty state, model/assets hashes, package freeze and install report
  - New per-session and per-run artifact paths with wall-clock/timezone/monotonic context
  - SDK snapshots with source timestamp, head/controller poses, and grips
  - Exact simulation command, console output, exit code, PID/port checks
  - Desktop video or explicit visual observation notes and video-unavailable gap
  - Failed starts, warnings, protocol deviations, cleanup, hashes, and backup status
evidence_limits:
  - SDK polling captures latest snapshots, not every source frame or raw network packets.
  - Stock simulation does not provide B-button logging or an independent live state telemetry recorder.
  - Visual response cannot establish numeric endpoint accuracy or end-to-end latency.
  - New timestamps alone do not establish correct or unfrozen tracking.
  - No physical robot behavior or safety is evaluated.
