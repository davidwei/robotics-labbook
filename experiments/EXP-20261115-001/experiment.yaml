physical_validation_required: true
physical_validation_scope: Meta Quest Pro and Touch Pro controllers only; no physical robot
physical_validation_status: not_started
physical_robot_validation_status: not_in_scope
question: >-
  Can XRoboToolkit-Quest v1.0.1 on Meta Quest Pro supply usable head and controller
  data through the Linux PC Service and Python SDK to operate the stock dual-UR5e
  MuJoCo simulation with explicit clutch, restart, and stop behavior?
hypothesis: >-
  The existing Quest client can serve as a native input source for this stock
  simulation after Linux dependencies, networking, and controller reference
  behavior are verified. Quest Pro support and reliable stop/reconnect behavior
  are not assumed from Quest 3 development or from an installed APK.
scope:
  includes:
    - Physical Quest Pro and two Touch Pro controllers
    - Ubuntu 24.04 x86_64 desktop with a local graphical session
    - Controller and head pose transport and input-only observation
    - Stock dual-UR5e MuJoCo simulation displayed on the Linux desktop
    - Grip-based relative control, clutch/reposition, clean restart, process stop
  excludes:
    - Physical G1, SO-101, UR, or other robot command publishing
    - G1/Revo2 hardware integration or whole-body control
    - Natural hand tracking and hand retargeting
    - Robot camera streaming or rendered simulation video returned to the headset
    - Unity rebuild, SDK modernization, and unreviewed control changes
    - Proven motion safety or quantitative latency/accuracy claims
success_criteria:
  - Hash-verified released APK launches on the identified Quest Pro and controllers operate its UI.
  - The correct Linux PC Service connects and Python receives changing poses and advancing source timestamps.
  - Each grip reports released and greater-than-0.9 squeezed states with correct handedness.
  - The actual MuJoCo example renders and the same-side simulated arm follows deliberate grip-enabled motion.
  - Grip release and regrip establish the expected relative reference without an unexplained large jump.
  - A clean restart repeats a bounded left/right sequence with fresh input and released grips checked first.
  - The simulator exits through its explicit terminal stop path and process absence is independently checked.
  - Evidence preserves failed attempts, candidate identity, capture boundaries, and known gaps.
minimum_useful_experiment:
  - APK launch on Quest Pro
  - Input-only evidence from both controllers and grips
  - One arm responds in actual MuJoCo
  - Deliberate simulator stop and verified process exit
