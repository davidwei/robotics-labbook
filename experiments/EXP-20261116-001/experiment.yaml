id: EXP-20261116-001
title: MuJoCo desktop video return to Meta Quest Pro during XRoboToolkit control
project: unitree-g1
owner: David Wei
participants: [David Wei, Codex]
status: ready_for_lab
prepared_date: 2026-11-16
timezone: America/Los_Angeles
planned_execution_date: 2026-11-16
mode: development_and_in_lab_simulation
environment_type: simulation_with_physical_headset
readiness: headset_run_ready_after_final_port_and_process_preflight
physical_validation_required: true
physical_validation_scope: Meta Quest Pro display and Touch Pro controllers only; no physical robot
physical_validation_status: not_started
physical_robot_validation_status: not_in_scope
question: >-
  Can the released XRoboToolkit Quest v1.0.1 client display a live H.264
  return view of the Linux MuJoCo desktop while its independent tracking path
  simultaneously controls the stock dual-UR5e simulation?
hypothesis: >-
  A desktop sender implementing the upstream OPEN_CAMERA control packet and
  length-prefixed H.264 access-unit protocol can deliver a duplicated
  monoscopic 2560x720 view through the released Quest decoder without
  preventing controller/grip input from reaching MuJoCo.
scope:
  includes:
    - Released XRoboToolkit Quest v1.0.1 app on Meta Quest Pro
    - Existing Linux PC Service and validated controller transport
    - Stock dual-UR5e MuJoCo simulator
    - X11 desktop capture duplicated side-by-side for the Quest stereo presentation path
    - H.264 NVENC stream requested through the app's ZEDMINI Listen workflow
    - Concurrent qualitative video continuity and bilateral control observation
  excludes:
    - Physical robot commands or motion
    - Calibrated stereo rendering, depth correctness or camera intrinsics
    - Quantitative motion-to-photon latency, image-quality or packet-loss characterization
    - Unity/Quest app rebuild
    - General reliability beyond the bounded run
success_criteria:
  - Offline mock Quest control/receiver test accepts an OPEN_CAMERA request and receives at least ten correctly framed H.264 access units.
  - The released Quest app requests the stream and the sender logs a connection to the headset video receiver on TCP 12345.
  - The operator sees and identifies the live MuJoCo desktop view in the headset for at least 30 seconds without a black or frozen view.
  - While viewing the return stream, deliberate right- and left-grip motions each produce recognizable same-side simulated-arm motion.
  - A deliberate grip-release pause leaves the corresponding arm still while the return view continues updating.
  - Evidence preserves the sender log, simulator log, desktop recording, exact sender snapshot/hash, and operator headset-view observation.
minimum_useful_experiment:
  - Quest OPEN_CAMERA request received with requested dimensions, rate and target address preserved
  - Sender connects back to Quest port 12345 and sends the first H.264 access unit
  - Operator reports whether a recognizable live desktop image appears
