network:
  desktop_ipv4: 10.9.0.149
  quest_ipv4_last_observed: 10.9.0.127
  video_control_tcp: 13579
  quest_video_receiver_tcp: 12345
  tracking_pc_service_tcp: 63901
  sdk_grpc: 60061
controls:
  stream_source: ZEDMINI
  stream_action: Quest Camera panel Listen, then enter desktop bare IPv4
  arm_enable: same-side side grip greater than 0.9
  stop_motion: release both grips
  stop_video: close the remote camera window or exit the Quest app, then stop the sender
safety:
  - Simulation only; no physical robot process or command path may be started.
  - Begin with small deliberate controller movements and both grips released.
  - Stop immediately for visual discomfort, disorientation, black/frozen display, or unexpected sustained arm motion.
  - Maintain a clear headset operating area and remove the headset before desktop recovery work.
evidence_to_capture:
  - Exact code hashes and sender command
  - Sender control request, target, first frame, periodic frame/rate logs and exit
  - Simulator console and PID boundary
  - Desktop screen recording covering stream start and control stages
  - Operator report of headset image continuity, comfort and recognizable motion
  - Quest screenshot or screen recording if available without destabilizing the run
fallbacks:
  - If the decoder is black, retry once at 30fps while retaining 2560x720 H.264.
  - If control and video interfere, isolate video-only and tracking-only paths before another combined attempt.
  - If the Quest does not connect to TCP 13579, verify the desktop listener and same-LAN reachability before changing code.
