    inspected_revision: 07a28333341629008187e988b73b48bced316092
    note: Local source has an unrelated unbuilt controller-status draft; the released APK remains installed and is the test client.
  upstream_sender_reference:
    repository: XR-Robotics/XRoboToolkit-Orin-Video-Sender
    inspected_revision: 8bedc7bb225628235f97b6e51bfde5a2a3704031
  desktop_sender:
