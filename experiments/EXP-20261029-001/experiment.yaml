id: EXP-20261029-001
title: PICO/SONIC planted-feet full-body control on G1-29
project: unitree-g1
owner: David Wei
participants: [David Wei, Codex]
status: active
question: >-
  Can the borrowed PICO 4 with two ankle trackers drive a deliberately bounded,
  planted-feet SONIC full-body demonstration on the physical G1-29 without stale
  input, pose discontinuity, uncommanded stepping or an unsafe stop outcome?
hypothesis: >-
  After exact hardware/firmware identification and repeatable instrumented
  simulation, a gantry-supported G1-29 can track small arm, torso and symmetric
  knee-flexion motions while both feet remain planted; this hypothesis is not yet
  supported by physical evidence.
success_criteria:
  - G1 manufacture/hardware revision, 29-DOF embodiment, system firmware, ankle mode and active motion service are recorded before command publication.
  - A bounded read-only DDS preflight receives fresh CRC-valid LowState and torso IMU data with 29 finite body joint states and no unexplained motor error.
  - The exact source, dirty patch, encoder, decoder, observation config, planner and generated TensorRT engine hashes are preserved.
  - The selected low-latency model/config passes three instrumented planted-feet simulation rehearsals with no unexplained fall, uncommanded step, mode duplication or stream gap at or above 100 ms.
  - Keyboard stop, PICO stop, process death and stale-stream outcomes are understood under suspension before any weight-bearing trial.
  - If separately authorized, the first physical demonstration completes only segments 0 through 5 of the planted-feet protocol without an abort condition or gantry catch.
physical_validation_required: true
related_repositories:
  - NVlabs/GR00T-WholeBodyControl
  - davidwei/robotics-labbook
related_sessions:
  - SESSION-20261029-001
  - SESSION-20261030-001
findings:
  - date: 2026-10-28
    scope: simulation-only mode-transition rehearsal
    evidence: >-
      Before the operator chord, PicoReader samples were intermittent (roughly
      14-36 Hz EMA with individual device-timestamp gaps of 100-610 ms). After one
      fully released A+B+X+Y transition from OFF to PLANNER and one A+X transition
      to POSE, the same process reported roughly 59-69 Hz PICO input, 47.7-50.0 Hz
      pose-loop output, and deployment stream delay mean/std of 17.477/10.263 ms.
      The manager logged exactly one OFF -> PLANNER, PLANNER -> POSE, and POSE ->
      PLANNER transition.
    interpretation: >-
      The workstation and manager can sustain the required rates once tracking is
      healthy. The exact cause of the pre-transition sparse device timestamps is
      not established; likely candidates include tracker/body-pipeline warm-up,
      tracking reacquisition, or headset/application scheduling. This does not
      relax the physical pre-command freshness gate: a robot command must not be
      used to make an unhealthy input stream become healthy.
  - date: 2026-10-28
    scope: second simulation-only mode and terminal-outcome rehearsal
    evidence: >-
      After a clean XRoboToolkit PC-service/manager reconnect, the pre-activation
      stream was again sparse (roughly 15-31 Hz EMA with sampled gaps up to about
      584 ms). OFF -> PLANNER immediately coincided with recovery to about 64 Hz;
      a sustained POSE interval held about 48-50 Hz pose output and approximately
      51-69 Hz PICO input. Deployment stream delay mean/std was 17.492/10.448 ms.
      Multiple logged POSE/PLANNER transitions occurred. At the end-of-run check,
      the manager reported device missing and MuJoCo reported a fall (height 0.198
      m); their exact ordering was not established. Local keyboard O produced an
      emergency stop and the deployment exited normally.
    interpretation: >-
      Healthy active tracking performance was repeatable, but the end state failed
      the stale-input/fall criteria and therefore is not a successful safety run.
      The independent local O path remained effective in this simulation. The
      recurring sparse-before-activation/fast-after-activation pattern merits a
      source-versus-transport timestamp capture, and mode-event/operator-video
      correlation is needed before interpreting the multiple transitions.
readiness: suspended_diagnostic_conditional; loaded_and_untethered_blocked
operator_decisions:
  - date: 2026-10-30
    decision: >-
      The unresolved stale-PICO response and stock-controller handover block
      weight-bearing and untethered experiments. They are questions to measure in
      a fully unloaded, gantry-suspended diagnostic with a separate safety
      operator, local keyboard stop, facility E-stop and independent whole-body
      state/IMU/command capture. This decision does not claim those responses are
      safe or that a launch has been authorized.
    source: operator statement during the PC2 lab session
    next_agent_action: >-
      Verify robot identity and PC2 candidate; run the independent read-only
      base/torso IMU, 35-slot LowState and LowCmd capture through the planned
      suspended stop outcomes. Preserve timestamps, packet gaps, motor status,
      commands, model/engine hashes and synchronized video.
    target: G1-29 with NVlabs/GR00T-WholeBodyControl on PC2
    prerequisites: >-
      Rated gantry fully unloading both feet, limb clearance, two operators,
      working local O and facility E-stop, read-only preflight, explicit motion
      authorization for each suspended diagnostic.
    physical_validation_status: read-only preflight captured; suspended motion not started
current_blockers:
  - G1 firmware, manufacture date, pelvis revision and motor-driver revision are not recorded.
  - The PC2 low-latency installation has built but has not completed PICO input, TensorRT engine or exact-candidate simulation validation.
  - The earlier x86 controller-latch change is absent from the clean PC2 checkout and needs review before PICO mode transitions.
  - A current rt/lowcmd stream was observed in read-only capture; its publisher must be identified before SONIC command publication.
  - Stale PICO and post-stop stock-controller behavior remain unvalidated and block loaded or untethered trials.
authorization_boundary: >-
  This experiment record authorizes planning, software/simulation work and read-only
  robot inspection only. Fully suspended diagnostic command publication requires
  separate explicit operator authorization after its stated preflight and capture
  conditions pass. Loaded and untethered trials require separate review and
  authorization after stale-input and handover behavior are understood.
protocols:
  setup: ../../ideas/IDEA-20261027-002/g1-29-sonic-setup.md
  demo: ../../ideas/IDEA-20261027-002/planted-feet-full-body-demo.md
  analysis: ../../ideas/IDEA-20261027-002/g1-29-physical-plan-20261028.md
