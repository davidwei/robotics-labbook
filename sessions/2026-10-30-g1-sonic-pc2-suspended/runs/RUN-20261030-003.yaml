observations:
  - Clean launch loaded prebuilt engines and reached Init Done before PICO connection.
  - Operator confirmed the robot was standing after initialization.
  - Patched manager logged exactly one OFF-to-PLANNER and one PLANNER-to-OFF transition and shut down XR SDK cleanly.
  - SONIC entered CONTROL with IDLE planner, received the PICO stop, printed Stop and exited normally with status 0.
  - Operator reported firm standing before the second chord, with the gantry not carrying the robot.
  - Policy CSV contains 613 rows over 12.28 seconds.
  - Maximum measured leg-joint range was 0.613 rad at hardware joint 3 (left knee).
  - Maximum overall measured joint speed was 6.262 rad/s at hardware joint 18 (left elbow).
  - Base roll, pitch and yaw ranges during policy control were 0.0666, 0.1664 and 0.1574 rad.
  - No sampled motor error/status, LowState/LowCmd CRC failure, recorder queue drop or callback failure occurred.
  - After stop the robot could not remain standing and relied on the gantry, matching the prior development-mode observation.
  - The retained post-stop capture lasted 60.23 seconds; no LowCmd resumed and maximum measured post-stop change was 0.359 rad at hardware joint 10 (right ankle pitch).
