decision: >-
  Treat active tethered ground-contact IDLE as physically demonstrated for this
  run. Treat the second chord as a process/control stop only: it does not preserve
  standing or restore stock control. Keep the gantry engaged through every stop,
  and do not generalize to locomotion, stale input or untethered use.
