result: diagnostic_complete_stop_handover_unresolved
observations:
  - SONIC printed Init Done; local O was accepted and the process exited normally with status 0.
  - Telemetry shows the default-pose transition settled in about three seconds with no sampled motor error.
  - The default pose was then held for about 26 seconds before O because terminal output was returned after a 30-second poll.
  - Nonzero-gain LowCmd publication lasted 29.405 seconds; maximum observed Kp 99.10, Kd 6.31 and feed-forward torque zero.
  - The largest measured INIT joint displacement was -0.671 rad at hardware joint 18 (left elbow).
  - After O, no LowCmd sample, damping frame or resumed stock command was observed during 5.37 seconds of post-stop capture.
  - With the robot suspended, joints relaxed after command publication stopped; largest measured post-stop change was 0.406 rad at hardware joint 25 (right elbow).
  - The operator visually described the INIT motion as smooth.
  - A delayed three-second check captured 963 LowState and 906 torso IMU samples but zero LowCmd, confirming the prior stock stream had not resumed by 01:53:31.
  - The operator interpreted the outcome as SONIC entering development mode without restoring the original mode on exit, consistent with prior experiments.
  - All captured LowState and LowCmd CRC checks passed; sampled motor status was zero and maximum sampled motor temperature was 51 C.
capture:
  coverage: partial
  sources: [independent_dds_jsonl, deployment_console, sonic_metadata, operator_statement]
  known_gaps:
    - Independent DDS recorder was interrupted after the post-stop interval and has no closing summary record.
    - SONIC CSV signal files are empty because the policy never entered CONTROL; metadata was written.
    - No synchronized video is registered.
    - No damping frame or stock-controller resumption was captured; a delayed check also saw no LowCmd.
decision: >-
  Accept the missing automatic mode restoration as a known gantry-only operating
  limitation. Do not treat local O as a return-to-stock handover, and do not use
  this behavior untethered. Before each separately authorized gantry run, assume
  SONIC must take ownership from the current development-mode state; restore stock
  mode explicitly when needed rather than expecting SONIC exit to do it.
evidence: ../evidence.json
