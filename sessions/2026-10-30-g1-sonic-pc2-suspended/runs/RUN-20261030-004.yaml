observations:
  - Five-second read-only preflight received 1515 LowState and 1458 torso-IMU samples, zero LowCmd, zero drops/callback failures and complete summary.
  - SONIC loaded the prebuilt engines, reached Init Done and entered CONTROL after one OFF-to-PLANNER transition.
  - Operator confirmed firm standing and visual pose alignment before A+X.
  - Manager logged PLANNER-to-POSE; the operator observed both legs retract from the floor into the air immediately after A+X.
  - Measured left/right knees changed from approximately 0.249/0.208 rad at POSE entry to 1.960/2.200 rad within 0.50 seconds.
  - Measured left/right hip pitch changed from approximately -0.085/0.162 rad to -1.456/-1.751 rad over the same 0.50 seconds.
  - During POSE, maximum measured leg-joint range was 2.198 rad at hardware joint 3 (left knee); maximum sampled joint speed was 19.281 rad/s at hardware joint 18 (left elbow).
  - POSE base roll, pitch and yaw ranges were 0.245, 0.833 and 0.527 rad respectively.
  - After observing the unexpected tuck, the operator intentionally pressed A+B+X+Y directly from POSE. The manager correctly logged POSE-to-OFF; the planned elbow cycle and POSE-to-PLANNER return were intentionally aborted.
  - Manager shut down XRoboToolkit cleanly with exit 0. SONIC timed out after five seconds while resetting to an uninitialized planner, printed Stop, then hit a CycloneDDS cleanup assertion and exited 134.
  - Independent capture retained 41.80 seconds after the last LowCmd and ended cleanly with 95688 LowState, 92545 torso-IMU and 30662 LowCmd records, zero drops/callback failures and zero captured CRC failures.
  - Operator confirmed the robot was secured on the gantry after the run.
capture:
  coverage: partial
  sources: [independent_dds_jsonl, deployment_console, pico_manager_console, sonic_csv, operator_statement]
  known_gaps:
    - Raw PICO/XRoboToolkit body-joint and outgoing SMPL pose packets were not recorded because the manager record directory was not enabled.
    - SONIC console diagnostics print only SMPL joint 0 and pose 0, not knee or ankle inputs; this run cannot determine whether the PICO input itself requested leg flexion.
    - No synchronized video is registered.
    - No gantry load-cell or foot-contact measurement was available.
    - Transcript lines do not carry per-event timestamps; mode durations come from SONIC CSV.
hypotheses:
  - statement: The leg tuck may originate in an incorrect tracked lower-body pose, coordinate/joint-order conversion, or an out-of-distribution PLANNER-to-POSE transition.
    status: unresolved
    note: Raw PICO/SMPL lower-body input is absent, so the alternatives cannot be separated from this run.
decision: >-
  Classify this as a failed POSE validation with a correct operator-initiated
  terminal stop. Do not repeat POSE on the physical robot until every outgoing
  PICO/SMPL packet is recorded and a stationary standing input is inspected
  offline through the manager and policy interface. Preserve gantry support
  through stop; this run does not clear untethered use.
