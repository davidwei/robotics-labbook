observations:
  - Clean relaunch loaded the prebuilt 710 MiB planner engine and reached Init Done without rebuilding it.
  - Patched manager logged exactly one OFF-to-PLANNER and one PLANNER-to-OFF transition; manager and XR SDK shut down cleanly.
  - SONIC entered CONTROL with the IDLE planner, received the PICO stop, printed Stop and exited normally with status 0.
  - Operator observed stepping attempts and feet tapping toward the floor while the robot was suspended, consistent with the earlier simulation.
  - Policy CSV contains 1125 rows over 22.54 seconds; the operator later clarified that this chord-to-chord duration was expected, superseding the initial protocol-miss interpretation.
  - Maximum measured policy-interval joint speed was 8.121 rad/s at hardware joint 3 (left knee).
  - Maximum measured policy-interval joint range was 0.821 rad at hardware joint 24 (right shoulder yaw); first-to-last change there was 0.760 rad.
  - Base yaw changed from 0.015 to 1.165 rad over the wider independent capture while the robot hung from the gantry.
  - No sampled motor error/status, LowState/LowCmd CRC failure, recorder queue drop or callback failure occurred.
  - LowCmd publication lasted 127.77 seconds including initialization and waiting; the retained post-stop capture lasted 19.84 seconds.
  - No damping frame or resumed stock LowCmd was captured after stop; maximum measured post-stop change was 0.231 rad at hardware joint 4 (left ankle pitch).
